<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Top Deals - STP Puja Bazaar</title>
<link href="https://fonts.googleapis.com/css?family=Inter:400,600,700" rel="stylesheet"/>
<style>
  body { font-family: Inter,sans-serif; margin:20px auto; max-width: 940px; background: #fff; }
  h1 { color:#1653f5; font-weight:700; }
  .product { display:flex; gap: 15px; border-bottom: 1px solid #0c8c3b44; padding:12px 0; }
  img { width: 135px; height: 105px; object-fit: cover; border-radius: 14px; }
  .product-info { flex:1; }
  .name { font-size: 1.1em; font-weight: 700; color: #1e7b32; }
  .price { font-weight: 800; color: #c0392b; font-size: 17px; margin: 7px 0; }
</style>
</head>
<body>
<h1>Top Deals (Price > ₹300)</h1>
<div id="topdeals"></div>
<script>
  // Reuse products from index (simulate)
  const BASE_NAMES = ["Diya","Flower","Incense","Puja Thali","Aarti Plate","Bell","Camphor","Lota","Sandalwood","Roli","Chawal","Ghee Lamp","Tulsi","Mala","Statue","Kalash","Panchapatra","Kumkum"];
  const PRODUCTS = [];
  for(let i=1; i<=500; i++){
    let base=BASE_NAMES[i%BASE_NAMES.length];
    PRODUCTS.push({
      id: i,
      name: base + " " + i,
      img: `https://picsum.photos/seed/${encodeURIComponent(base+i)}/640/480`,
      price: Math.floor(Math.random()*451) + 50,
      desc: "Premium authentic puja product."
    });
  }
  const filtered = PRODUCTS.filter(p => p.price > 300);

  const el = document.getElementById('topdeals');
  filtered.forEach(p => {
    const d = document.createElement('div');
    d.className = "product";
    d.innerHTML = `<img src="${p.img}" alt="${p.name}" />
      <div class="product-info">
        <div class="name">${p.name}</div>
        <div class="price">₹${p.price}</div>
      </div>`;
    el.appendChild(d);
  });
</script>
</body>
</html>
