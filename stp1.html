<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>STP Puja Bazaar — Online Catalog</title>
  <link href="https://fonts.googleapis.com/css?family=Inter:400,600,700" rel="stylesheet" />
  <style>
    :root {
      --primary: #1653f5;
      --accent:#1e7b32;
      --danger:#c0392b;
      --bg:#f8f9fa;
      --card:#fff;
      --muted:#555;
      --radius:14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Inter,sans-serif; background: var(--bg); color: #222; overflow-x: hidden;
    }
    header {
      display: flex; align-items: center; gap: 14px; padding: 15px; position: sticky; top: 0; z-index: 20;
      background: var(--card); box-shadow: 0 1px 6px rgba(30,30,60,.06);
    }
    .logo {
      display: flex; align-items: center; gap: 10px; user-select: none;
      cursor: default;
    }
    .logo img {
      width: 44px; height: 44px; border-radius: var(--radius); background: #fff;
      box-shadow: 0 1px 5px #e5e7ef;
    }
    .brand {
      font-weight: 700; font-size: 21px; color: var(--primary);
    }
    .tagline {
      font-size: 13px; color: var(--muted);
    }
    .searchbar {
      flex: 1; display: flex; gap: 10px;
    }
    .searchbar input {
      width: 100%; padding: 10px 13px; border-radius: 9px; border: 1.4px solid #d8d8d8; font-size: 15px;
    }
    .searchbar button {
      padding: 10px 18px; border-radius: 9px; border: none; background: var(--accent);
      color: white; font-weight: 700; cursor: pointer;
      transition: background 0.2s ease;
    }
    .searchbar button:hover {
      background: #155820;
    }
    .actions button {
      margin-left: 10px; padding: 10px 16px; border-radius: 10px; border: none;
      background: var(--primary); color: white; font-weight: 700; cursor: pointer;
      transition: background 0.3s ease;
    }
    .actions button.btn-ghost {
      background: transparent; border: 1.4px solid var(--primary); color: var(--primary);
    }
    .actions button:hover {
      background: var(--primary); color: white;
    }
    .actions button.btn-ghost:hover {
      background: var(--primary); color: white;
    }
    main {
      max-width: 1280px; margin: 25px auto 90px; padding: 0 12px;
    }
    .catalog {
      display: grid; grid-template-columns: repeat(auto-fill,minmax(230px,1fr)); gap: 18px;
    }
    .card {
      background: var(--card); border-radius: var(--radius); box-shadow: 0 3px 14px rgba(30,60,110,0.07);
      padding-bottom: 10px; display: flex; flex-direction: column;
      cursor: default;
      user-select: none;
      transition: filter 0.3s ease;
    }
    .card:hover {
      filter: brightness(1.05);
      box-shadow: 0 10px 28px rgba(30,60,110,0.15);
    }
    .card img {
      width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: var(--radius) var(--radius) 0 0;
    }
    .card-content {
      padding: 14px 16px 0 16px; flex: 1; display: flex; flex-direction: column;
    }
    .card h4 {
      margin: 0 0 8px 0; font-size: 1.14em; font-weight: 800; color: var(--primary);
    }
    .desc {
      flex: 1; font-size: 14px; color: var(--muted); margin-bottom: 14px;
    }
    .price {
      font-weight: 800; color: var(--accent); font-size: 18px;
    }
    .card .actions {
      margin-top: auto; display: flex; gap: 12px;
    }
    .card .actions button {
      flex: 1; border: none; border-radius: 8px; padding: 9px 0; font-weight: 800;
      color: white; cursor: pointer; transition: background 0.27s ease;
    }
    .card .actions button.add {
      background: var(--accent);
    }
    .card .actions button.add:hover {
      background: #124816;
    }
    .card .actions button.buy {
      background: var(--primary);
    }
    .card .actions button.buy:hover {
      background: #0f3bbd;
    }
    /* Modal */
    .modal-back {
      position: fixed; inset: 0; background: rgba(0,0,0,0.48); display: none;
      align-items: center; justify-content: center; z-index: 950;
    }
    .modal {
      background: var(--card); border-radius: 16px; max-width: 400px; width: 90vw;
      padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      max-height: 80vh; overflow-y: auto;
    }
    .modal h2 {
      margin-top: 0; color: var(--primary);
    }
    .modal form input, .modal form select {
      width: 100%; padding: 12px; margin: 10px 0 18px 0; border-radius: 10px; border: 1.4px solid #ccc;
      font-size: 16px;
    }
    .modal form button {
      width: 100%; padding: 14px; border:none; border-radius: 10px;
      background: var(--primary); color: white; font-weight: 700; cursor: pointer;
    }
    .modal form button.cancel {
      background: transparent; color: var(--primary); border: 2px solid var(--primary);
      margin-top: 12px;
    }
    /* Toast */
    .toast {
      position: fixed; bottom: 24px; right: 20px; background: var(--primary);
      color: white; padding: 14px 20px; border-radius: 12px;
      font-weight: 700; box-shadow: 0 10px 22px rgba(0,0,0,0.2);
      z-index: 1100; opacity: 0.95; user-select: none;
      animation: fadeout 1.5s ease 1.1s forwards;
    }
    @keyframes fadeout {
      to {opacity: 0; transform: translateY(30px);}
    }
    /* Bottom navigation */
    nav.bottom-nav {
      position: fixed; bottom: 0; left: 0; width: 100vw; height: 70px;
      background: white; box-shadow: 0 -2px 15px rgba(0,0,0,0.07);
      display: flex; justify-content: space-around; align-items: center; z-index: 1099;
    }
    nav.bottom-nav a {
      text-decoration: none; color: #555; font-weight: 600;
      font-size: 13.8px; display: flex; flex-direction: column; align-items: center;
      justify-content: center; flex: 1; position: relative;
      padding: 6px 2px 0 2px;
      transition: color 0.2s;
    }
    nav.bottom-nav a svg {
      width: 26px; height: 24px; margin-bottom: 2px;
      stroke: currentColor; stroke-width: 2; fill:none;
    }
    nav.bottom-nav a.active {
      color: var(--primary);
    }
    .cart-badge {
      position: absolute; top: 6px; right: 22px;
      background: var(--danger); color: white;
      font-weight: 700; font-size: 13px;
      border-radius: 14px; padding: 2px 8px;
      min-width: 20px; text-align: center;
    }
    @media(max-width: 450px) {
      header {
        font-size: 13px;
        gap: 8px;
      }
      main {
        margin-bottom: 110px;
      }
      .modal {
        max-width: 95vw;
        padding: 14px;
      }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo" title="STP Puja Bazaar">
    <img src="https://picsum.photos/seed/rose-stp/120/120" alt="Logo"/>
    <div>
      <div class="brand">STP Puja Bazaar</div>
      <div class="tagline">Online Puja Products • Authentic Quality</div>
    </div>
  </div>
  <div class="searchbar">
    <input id="searchInput" placeholder="Search products, e.g. 'Diya'..." aria-label="Search products"/>
    <button id="searchBtn" aria-label="Search Button">Search</button>
  </div>
  <div class="actions">
    <button id="loginBtn">Login</button>
    <button id="registerBtn" class="btn-ghost">Register</button>
  </div>
</header>

<!-- MAIN -->
<main>
  <div style="display:flex; justify-content: space-between; align-items:center; margin-top: 16px;">
    <h2 style="font-weight: 700; color: var(--primary); margin: 0;">Puja Items</h2>
    <button id="topDealsBtn" style="font-weight: 700; padding: 6px 12px; border-radius: 10px; border: none; background: var(--accent); color: white; cursor: pointer;">Top Deals</button>
  </div>
  <div class="catalog" id="catalog" aria-live="polite" aria-relevant="additions"></div>
</main>

<!-- MODAL ROOT -->
<div id="modalRoot" class="modal-back" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal" id="modalContent"></div>
</div>

<!-- NAVIGATION -->
<nav class="bottom-nav" role="navigation" aria-label="Bottom Navigation">
  <a href="#" class="bnav-item active" id="navHome" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-4.5a1 1 0 0 1-1-1v-4.5h-2V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5Z" /></svg>
    Home
  </a>
  <a href="#" class="bnav-item" id="navPlay">
    <svg viewBox="0 0 26 26" aria-hidden="true"><rect x="5" y="5" width="16" height="16" rx="4" /><polygon points="11,10 17,13 11,16" /></svg>
    Play
  </a>
  <a href="#" class="bnav-item" id="navTopDeals">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20l3.54-1.92c.4-.22.67-.64.67-1.1v-2.32c0-.46-.27-.88-.67-1.1L12 11.05l-3.54 1.93c-.4.22-.67.63-.67 1.1v2.32c0 .46.27.88.67 1.1L12 20z"/><circle cx="12" cy="8" r="2"/></svg>
    Top Deals
  </a>
  <a href="#" class="bnav-item" id="navAccount">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M6 20v-1a6 6 0 0 1 12 0v1"/></svg>
    Account
  </a>
  <a href="#" class="bnav-item bnav-cart" id="navCart" style="position: relative;">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="21" r="1.2"/><circle cx="19" cy="21" r="1.2"/><path d="M1.5 2h2.26a1 1 0 0 1 .99.82l.47 2.35M6.22 6.59 6.89 10c0 .41.29.75.7.88l9.1 2.61a1 1 0 0 0 1.27-.64l2.51-7.03A1 1 0 0 0 18.52 4H5.21m0 0L4.48 2.6"/></svg>
    Cart
    <span id="cartBadge" class="cart-badge" style="display:none;">0</span>
  </a>
</nav>

<script>
  // Products building with 500 products
  const BASE_NAMES = ["Diya","Flower","Incense","Puja Thali","Aarti Plate","Bell","Camphor","Lota","Sandalwood","Roli","Chawal","Ghee Lamp","Tulsi","Mala","Statue","Kalash","Panchapatra","Kumkum"];
  const PRODUCTS = [];
  for(let i=1; i<=500; i++) {
    let base = BASE_NAMES[i % BASE_NAMES.length];
    PRODUCTS.push({
      id: i,
      name: base + " " + i,
      img: `https://picsum.photos/seed/${encodeURIComponent(base+i)}/640/480`,
      price: Math.floor(Math.random() * 451) + 50,
      desc: base + " - premium authentic puja product."
    });
  }
  
  let CART = JSON.parse(localStorage.getItem('cart')) || {};
  
  const catalogEl = document.getElementById('catalog');
  
  function rupee(n) {
    return "₹" + Number(n).toLocaleString('en-IN');
  }
  
  function updateCartBadge() {
    const count = Object.values(CART).reduce((a,b) => a+b, 0);
    const badge = document.getElementById('cartBadge');
    badge.textContent = count;
    badge.style.display = count > 0 ? 'inline-block' : 'none';
  }

  function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2000);
  }

  function openModal(html) {
    const modalContent = document.getElementById('modalContent');
    const modalRoot = document.getElementById('modalRoot');
    modalContent.innerHTML = html;
    modalRoot.style.display = "flex";
    modalRoot.focus();
  }

  function closeModal() {
    document.getElementById('modalRoot').style.display="none";
    document.getElementById('modalContent').innerHTML= "";
  }
  
  document.getElementById('modalRoot').addEventListener('click', e => {
    if(e.target === document.getElementById('modalRoot')) closeModal();
  });

  // Renders the catalog items in grid
  function renderCatalog(items) {
    catalogEl.innerHTML = '';
    items.forEach(product => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${product.img}" alt="${product.name}"/>
        <div class="card-content">
          <h4>${product.name}</h4>
          <div class="desc">${product.desc}</div>
          <div class="price">${rupee(product.price)}</div>
          <div class="actions">
            <button class="add">Add to Cart</button>
            <button class="buy">Buy Now</button>
          </div>
        </div>
      `;
      card.querySelector('.add').onclick = () => {
        CART[product.id] = (CART[product.id] || 0) + 1;
        localStorage.setItem('cart', JSON.stringify(CART));
        updateCartBadge();
        showToast("Added to cart");
      };
      card.querySelector('.buy').onclick = () => {
        window.open(`buy_address.html?pid=${product.id}`, '_blank');
      };
      catalogEl.appendChild(card);
    });
    document.getElementById('visibleCount').textContent = items.length;
  }

  renderCatalog(PRODUCTS);
  
  // SEARCH BOX
  document.getElementById('searchBtn').onclick = () => {
    const query = document.getElementById('searchInput').value.toLowerCase();
    if(!query) renderCatalog(PRODUCTS);
    else {
      const filtered = PRODUCTS.filter(p => (p.name + p.desc).toLowerCase().includes(query));
      renderCatalog(filtered);
    }
  };

  // LOGIN MODAL
  document.getElementById('loginBtn').onclick = () => {
    openModal(`
      <h2>Login</h2>
      <form onsubmit="event.preventDefault(); closeModal(); showToast('Logged in successfully');">
        <input type="email" placeholder="Email" required autocomplete="username"/>
        <input type="password" placeholder="Password" required autocomplete="current-password"/>
        <button type="submit" class="btn-submit">Login</button>
        <button type="button" class="btn-ghost" onclick="closeModal()">Cancel</button>
      </form>
    `);
  };

  // REGISTER MODAL
  document.getElementById('registerBtn').onclick = () => {
    openModal(`
      <h2>Register</h2>
      <form onsubmit="event.preventDefault(); closeModal(); showToast('Registered successfully');">
        <input type="text" placeholder="Full Name" required/>
        <input type="email" placeholder="Email" required/>
        <input type="password" placeholder="Password" required/>
        <button type="submit" class="btn-submit">Register</button>
        <button type="button" class="btn-ghost" onclick="closeModal()">Cancel</button>
      </form>
    `);
  };

  // NAVIGATION BUTTONS
  document.getElementById('topDealsBtn').onclick = () => {
    window.open('topdeals.html', '_blank');
  };

  document.getElementById('navTopDeals').onclick = () => {
    window.open('topdeals.html', '_blank');
  };

  document.getElementById('navCart').onclick = () => {
    window.open('cart.html', '_blank');
  };

  // bottom nav highlight logic (optional)
  document.querySelectorAll('.bnav-item').forEach(el => {
    el.onclick = () => {
      document.querySelectorAll('.bnav-item').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      if(el.id === 'navCart') window.open('cart.html', '_blank');
      else if(el.id === 'navTopDeals') window.open('topdeals.html', '_blank');
    };
  });

  updateCartBadge();
</script>
</body>
</html>
