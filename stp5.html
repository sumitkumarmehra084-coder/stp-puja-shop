<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Payment - STP Puja Bazaar</title>
  <link href="https://fonts.googleapis.com/css?family=Inter:400,600,700" rel="stylesheet" />
  <style>
    body { font-family: Inter,sans-serif; max-width: 450px; margin: 30px auto; background:#fdfdfd; padding: 0 12px;}
    h2 { color: #1653f5; font-weight: 900;}
    .summary {font-weight: 700; color: #1e7b32; margin-bottom: 18px;}
    label {display: block; margin: 16px 0 6px 0; font-weight: 700; font-size: 15px;}
    select, input {width: 100%; padding: 10px; border-radius: 8px; border: 1.6px solid #aaa; font-size: 15px;}
    button {
      margin-top: 22px; width: 100%; background: var(--primary, #1e7b32);
      border: none; border-radius: 15px; padding: 15px;
      font-weight: 900; font-size: 18px; color: white;
      cursor: pointer;
    }
    button:hover {
      background: #134713;
    }
  </style>
</head>
<body>
  <h2>Payment</h2>
  <div class="summary" id="summary"></div>
  <form id="paymentForm">
    <label>Payment Method</label>
    <select id="paymentMethod" required>
      <option value="cod" selected>Cash on Delivery</option>
      <option value="upi">UPI</option>
    </select>
    <button type="submit">Confirm Order</button>
  </form>

  <script>
    // Load cart and buyerInfo
    const cartJSON = localStorage.getItem('cart');
    const buyerJSON = localStorage.getItem('buyerInfo');
    if (!cartJSON || !buyerJSON) {
      alert('Cart or Buyer information missing. Redirecting to home.');
      window.location.href = 'index.html';
    }
    const CART = JSON.parse(cartJSON);
    const buyer = JSON.parse(buyerJSON);

    // Recreate Products (same)
    const BASE_NAMES = ["Diya","Flower","Incense","Puja Thali","Aarti Plate","Bell","Camphor","Lota","Sandalwood","Roli","Chawal","Ghee Lamp","Tulsi","Mala","Statue","Kalash","Panchapatra","Kumkum"];
    const PRODUCTS = [];
    for(let i=1; i<=500; i++){
      let base=BASE_NAMES[i % BASE_NAMES.length];
      PRODUCTS.push({
        id: i,
        name: base + " " + i,
        price: Math.floor(Math.random()*451) + 50
      });
    }

    // Calculate total
    let total = 0;
    let summaryTxt = `<p><strong>Name:</strong> ${buyer.name}</p>
                      <p><strong>Phone:</strong> ${buyer.phone}</p>
                      <p><strong>Address:</strong> ${buyer.address}</p>
                      <p><strong>Order Details:</strong></p><ul>`;
    for(const [pid, qty] of Object.entries(CART)){
      const product = PRODUCTS.find(p => p.id == pid);
      if(product){
        const subtotal = product.price * qty;
        total += subtotal;
        summaryTxt += `<li>${product.name} (×${qty}) : ₹${subtotal}</li>`;
      }
    }
    summaryTxt += `</ul><p><strong>Total Amount: ₹${total}</strong></p>`;
    document.getElementById('summary').innerHTML = summaryTxt;

    document.getElementById('paymentForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const paymentMethod = document.getElementById('paymentMethod').value;
      alert(`Order placed successfully! Payment method: ${paymentMethod.toUpperCase()}`);
      // Clear cart & buyer info
      localStorage.removeItem('cart');
      localStorage.removeItem('buyerInfo');
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
