<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Shopping Cart - STP Puja Bazaar</title>
<link href="https://fonts.googleapis.com/css?family=Inter:400,600,700" rel="stylesheet"/>
<style>
  body { font-family: Inter,sans-serif; margin:20px auto; max-width: 920px; background: #fff; }
  h1 { color:#1653f5; font-weight:700;}
  .cart-item {
    display: flex; gap: 15px; padding: 10px 0; border-bottom: 1px solid #7bb56d44;
    align-items: center;
  }
  img { width: 120px; height: 90px; object-fit: cover; border-radius: 13px; }
  .info { flex:1; }
  .name { font-weight: 700; font-size: 1.15em; }
  .price, .quantity { font-weight: 700; color: #1e7b32; margin-top: 6px; }
  .quantity input { width: 40px; font-size: 15px; padding: 6px 6px; border-radius: 7px; border: 1px solid #ccc; }
  .empty { font-style: italic; color: #c0392b; font-weight: 700; margin-top: 20px; }
  button.buy-now {
    font-weight: 700; background-color: #1653f5; color: white;
    padding: 14px 24px; border: none; border-radius: 15px;
    cursor: pointer; margin-top: 20px;
  }
  button.buy-now:hover {
    background-color: #0f38b0;
  }
</style>
</head>
<body>
<h1>Your Cart</h1>
<div id="cartItems"></div>
<button id="buyButton" class="buy-now" style="display:none;">Proceed to Buy</button>

<script>
  // Recreate products list for reference
  const BASE_NAMES = ["Diya","Flower","Incense","Puja Thali","Aarti Plate","Bell","Camphor","Lota","Sandalwood","Roli","Chawal","Ghee Lamp","Tulsi","Mala","Statue","Kalash","Panchapatra","Kumkum"];
  const PRODUCTS = [];
  for(let i=1; i<=500; i++){
    let base=BASE_NAMES[i % BASE_NAMES.length];
    PRODUCTS.push({
      id: i,
      name: base + " " + i,
      img: `https://picsum.photos/seed/${encodeURIComponent(base+i)}/640/480`,
      price: Math.floor(Math.random()*451) + 50
    });
  }

  const cartJSON = localStorage.getItem('cart');
  const CART = cartJSON ? JSON.parse(cartJSON) : {};

  const container = document.getElementById('cartItems');
  let hasItems = false, total = 0;

  for(const [pid, qty] of Object.entries(CART)) {
    const product = PRODUCTS.find(p=>p.id == pid);
    if(!product) continue;
    hasItems = true;
    total += product.price * qty;
    const div = document.createElement('div');
    div.className = "cart-item";
    div.innerHTML = `
      <img src="${product.img}" alt="${product.name}" />
      <div class="info">
        <div class="name">${product.name}</div>
        <div class="price">₹${product.price}</div>
        <div class="quantity">Quantity: ${qty}</div>
      </div>
    `;
    container.appendChild(div);
  }

  if(!hasItems){
    container.innerHTML = '<p class="empty">Your cart is empty.</p>';
  } else {
    const totalDiv = document.createElement('div');
    totalDiv.style.fontWeight = "700";
    totalDiv.style.fontSize = "1.2em";
    totalDiv.style.color = "#1653f5";
    totalDiv.style.marginTop = "20px";
    totalDiv.textContent = `Total: ₹${total.toFixed(2)}`;
    container.appendChild(totalDiv);

    const buyBtn = document.getElementById('buyButton');
    buyBtn.style.display = 'block';
    buyBtn.onclick = () => {
      // Save all product ids with their quantities to pass
      const cartData = JSON.stringify(CART);
      localStorage.setItem('buy_cart', cartData);
      window.open('buy_address.html?multi=true', '_blank');
    };
  }
</script>
</body>
</html>
